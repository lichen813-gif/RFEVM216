site_name: RFEVM216 Documentation
site_description: English-first bilingual documentation and reference examples for the RFEVM216 RFSoC development platform
site_url: https://lichen813-gif.github.io/RFEVM216/
repo_url: https://github.com/lichen813-gif/RFEVM216
repo_name: lichen813-gif/RFEVM216

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search:
      lang:
        - en
        - zh

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - English:
      - Overview: en/index.md
      - User Guide:
          - Overview: en/user-guide/index.md
          - 1. Introduction: en/user-guide/01-introduction.md
          - 2. RFSOM216 SoM Board: en/user-guide/02-som-board.md
          - 3. Carrier Board: en/user-guide/03-carrier-board.md
          - Pin Mapping Reference: en/user-guide/04-pin-mapping.md
      - FPGA Tutorial:
          - Overview: en/fpga-tutorial/index.md
          - 1. Board Introduction: en/fpga-tutorial/01-board-introduction.md
          - 2. Environment Setup: en/fpga-tutorial/02-environment-setup.md
          - 3. PL Peripherals:
              - Overview: en/fpga-tutorial/03-pl-peripherals/index.md
              - 3.1 LED Breathing Light: en/fpga-tutorial/03-pl-peripherals/01-led-breathing-light.md
              - 3.2 PL DDR4 Read/Write: en/fpga-tutorial/03-pl-peripherals/02-pl-ddr4.md
              - 3.3 GTY IBERT Test: en/fpga-tutorial/03-pl-peripherals/03-gty-ibert.md
          - 4. PS Peripherals:
              - Overview: en/fpga-tutorial/04-ps-peripherals/index.md
              - 4.1 IPI Design: en/fpga-tutorial/04-ps-peripherals/01-ipi-design.md
              - 4.2 ARM Hello World: en/fpga-tutorial/04-ps-peripherals/02-arm-hello-world.md
              - 4.3 RTC Interrupt: en/fpga-tutorial/04-ps-peripherals/03-rtc-interrupt.md
              - 4.4 PS IIC: en/fpga-tutorial/04-ps-peripherals/04-iic.md
              - 4.5 lwIP Ethernet: en/fpga-tutorial/04-ps-peripherals/05-lwip-ethernet.md
              - 4.6 DisplayPort: en/fpga-tutorial/04-ps-peripherals/06-displayport.md
              - 4.7 SD Card Read/Write: en/fpga-tutorial/04-ps-peripherals/07-sd-card.md
              - 4.8 USB Slave: en/fpga-tutorial/04-ps-peripherals/08-usb-slave.md
          - 5. PS-PL Interconnect:
              - Overview: en/fpga-tutorial/05-ps-pl-interconnect/index.md
              - 5.1 PS EMIO: en/fpga-tutorial/05-ps-pl-interconnect/01-emio.md
              - 5.2 PL AXI GPIO: en/fpga-tutorial/05-ps-pl-interconnect/02-axi-gpio.md
              - 5.3 PL Register Access: en/fpga-tutorial/05-ps-pl-interconnect/03-pl-register-access.md
              - 5.4 AXI-DMA Loopback: en/fpga-tutorial/05-ps-pl-interconnect/04-axi-dma-loopback.md
          - 6. FAQs: en/fpga-tutorial/06-faqs.md
      - RF Development Guide:
